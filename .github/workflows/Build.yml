name: Build JEI-Bedrock

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r28c
        run: sdkmanager "ndk;28.2.13676358"

      - name: Install CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Set NDK path
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_PATH"

      - name: Verify NDK
        run: |
          echo "NDK: $ANDROID_NDK_HOME"
          test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          ls "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Find shared libraries
        run: find build -type f -name "*.so" -print

      - name: Upload SO
        uses: actions/upload-artifact@v4
        with:
          name: JEIBedrock-arm64
          path: build/**/*.so
